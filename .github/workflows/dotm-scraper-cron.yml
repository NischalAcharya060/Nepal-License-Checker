name: DOTM scraper cron

on:
  schedule:
    - cron: '0 2 1,15 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-scrape all PDFs (ignore already processed cache)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dotm-scraper-cron
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 90
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN || vars.TURSO_AUTH_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
      SMTP_SERVICE: ${{ secrets.SMTP_SERVICE || vars.SMTP_SERVICE }}
      SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS || vars.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM || vars.SMTP_FROM }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required credentials
        run: |
          if [ -z "${TURSO_DATABASE_URL}" ]; then
            echo "Missing TURSO_DATABASE_URL (set it in repo Secrets/Variables or Production environment secrets)"
            exit 1
          fi
          if [ -z "${TURSO_AUTH_TOKEN}" ]; then
            echo "Missing TURSO_AUTH_TOKEN (set it in repo Secrets/Variables or Production environment secrets)"
            exit 1
          fi

      - name: Run DOTM scraper
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "⚡ Force re-scrape requested: processing all PDFs..."
            npm run cron:scrape -- --force
          else
            echo "💡 Running incremental scrape: skipping already processed PDFs..."
            npm run cron:scrape
          fi
